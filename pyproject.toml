[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "franklinwh"
version = "9999.9.9.dev9"
authors = [
  { name = "Richo Butts", email = "richo@psych0tik.net" },
  { name = "Jack Thomasson", email = "4302889+jkt628@users.noreply.github.com" },
]
description = "Python wrapper for FranklinWH"
readme = "README.md"
requires-python = ">=3.8"
classifiers = []
dependencies = ["httpx[http2]>=0.28.1"]

[project.optional-dependencies]
bin = ["jsonpickle"]
build = ["build", "twine"]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/jkt628/franklinwh-python/tree/fake-it-til-you-make-it"

[tool.hatch.build]
exclude = ["/env", ".*"]

[tool.ruff]
line-length = 120
